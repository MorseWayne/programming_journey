name: journey-platform-lab
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: journey-local-only
      MYSQL_DATABASE: journey_lab
    ports:
      - "127.0.0.1:34067:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pjourney-local-only"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:36379:6379"
volumes:
  mysql_data:
